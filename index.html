<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soloforte – Peças e Componentes Agrícolas</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #050a07;
      --darkgray: #0b110e;
      --green:    #39b54a;
      --green-dk: #1a3a22;
      --green-lt: #7ed957;
      --offwhite: #e8ede8;
      --border:   #161c18;
      --card-bg:  #030705;
      --steel:    #aaaaaa;
      --disabled: #444;
      --radius:   12px;
    }

    body {
      font-family: 'Barlow', sans-serif;
      color: var(--offwhite);
      min-height: 100vh;
      background: none;
    }

    #bg-fixed {
      position: fixed;
      inset: 0;
      background-image: url('/bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 7, 0.85);
      z-index: -1;
      pointer-events: none;
    }

    header, .hero-strip, .category-tabs, main, footer, section, nav, .container {
      position: relative;
      z-index: 1;
    }

    /* ── HEADER ── */
    header {
      background: rgba(11, 17, 14, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 2px solid var(--green-dk);
    }
    header img {
      height: 64px;
      width: auto;
      background: transparent !important;
      display: block;
    }
    .header-text .tagline {
      font-size: 0.75rem;
      color: var(--steel);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── HERO STRIP ── */
    .hero-strip {
      background: linear-gradient(135deg, rgba(26,58,34,0.65) 0%, rgba(11,17,14,0.75) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 28px 40px;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(57,181,74,0.15);
    }
    .hero-strip::before {
      content: '';
      position: absolute;
      right: -60px; top: -60px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: rgba(255,255,255,0.02);
    }
    .hero-strip h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.6rem;
      color: #fff;
      letter-spacing: 4px;
      position: relative; z-index: 1;
    }
    .hero-strip h1 span { color: var(--green); }
    .hero-strip p {
      color: var(--steel);
      font-size: 0.95rem;
      margin-top: 4px;
      position: relative; z-index: 1;
      letter-spacing: 0.5px;
    }

    /* ── CATEGORY TABS ── */
    .category-tabs-wrapper {
      position: relative;
      background: rgba(11,17,14,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .category-tabs {
      background: transparent;
      display: flex;
      gap: 0;
      padding: 0 40px;
      border-bottom: none;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 2px;
      color: var(--steel);
      padding: 14px 28px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
      background: none;
      border-top: none; border-left: none; border-right: none;
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-tab:hover { color: var(--green-lt); }
    .cat-tab.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    /* ── MAIN ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── STEP INDICATOR ── */
    .steps {
      display: flex;
      align-items: center;
      margin-bottom: 44px;
      max-width: 860px;
      margin-left: auto;
      margin-right: auto;
    }
    .step { display: flex; align-items: center; gap: 10px; flex: 1; }
    .step-num {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--border);
      color: var(--steel);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .3s, color .3s;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .step-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--steel);
      transition: color .3s;
    }
    .step.active .step-num { background: var(--green-dk); color: #fff; border-color: var(--green); }
    .step.active .step-label { color: var(--green); }
    .step.done .step-num { background: var(--green); color: #fff; border-color: var(--green); }
    .step.done .step-label { color: var(--green-lt); }
    .step-line {
      flex: 1; height: 2px;
      background: var(--border);
      margin: 0 8px;
      transition: background .3s;
    }
    .step-line.done { background: var(--green); }

    /* ── SECTION ── */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--green-lt);
      margin-bottom: 4px;
    }
    .section-sub {
      font-size: 0.88rem;
      color: var(--steel);
      margin-bottom: 24px;
    }

    /* ── OPTION CARDS ── */
    .options-grid { display: grid; gap: 14px; }
    .options-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .options-grid.cols-2 { grid-template-columns: repeat(2, 1fr); max-width: 460px; margin: 0 auto; }
    .options-grid.cols-auto { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }

    .option-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 14px;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .option-card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--green-dk), #1a3a22);
      opacity: 0;
      transition: opacity .2s;
    }
    .option-card:hover {
      border-color: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(57,181,74,0.15);
    }
    .option-card.selected {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(57,181,74,0.2);
    }
    .option-card.selected::before { opacity: 0.08; }

    .option-card .label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ccd8cc;
      position: relative; z-index: 1;
      line-height: 1.3;
    }
    .option-card.selected .label { color: var(--green-lt); }

    .check-badge {
      position: absolute; top: 8px; right: 8px;
      width: 20px; height: 20px;
      background: var(--green);
      border-radius: 50%;
      display: none;
      align-items: center; justify-content: center;
      color: #fff; font-size: 0.65rem; z-index: 2;
    }
    .option-card.selected .check-badge { display: flex; }
    .card-svg { width: 64px; height: 64px; margin: 0 auto 12px; display: block; }

    /* ── NAVIGATION ── */
    .nav-buttons { display: flex; gap: 12px; margin-top: 36px; justify-content: center; }
    .btn {
      padding: 12px 32px;
      border: none; border-radius: 8px;
      font-family: 'Barlow', sans-serif;
      font-weight: 700; font-size: 0.9rem;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--green); color: #000; }
    .btn-primary:hover { background: var(--green-lt); }
    .btn-primary:disabled { background: var(--disabled); color: #888; cursor: not-allowed; transform: none; }
    .btn-secondary { background: transparent; color: #ccc; border: 2px solid var(--border); }
    .btn-secondary:hover { border-color: var(--steel); }

    /* ── RESULT CARD ── */
    .result-card {
      background: linear-gradient(135deg, #060f0a, #0b110e);
      border: 1px solid var(--green-dk);
      border-radius: var(--radius);
      padding: 36px;
      position: relative; overflow: hidden;
      max-width: 860px;
      margin: 0 auto;
    }
    .result-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--green);
      margin-bottom: 8px;
    }
    .result-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      line-height: 1.1;
      margin-bottom: 20px;
      color: #fff;
    }
    .result-specs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .spec-pill {
      background: rgba(57,181,74,0.12);
      border: 1px solid rgba(57,181,74,0.25);
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--green-lt);
    }
    .result-cta {
      display: inline-flex; align-items: center; gap: 10px;
      background: #25d366; color: #fff;
      padding: 14px 28px; border-radius: 8px;
      font-weight: 700; font-size: 0.9rem;
      text-decoration: none;
      text-transform: uppercase; letter-spacing: 1px;
      transition: background .2s;
    }
    .result-cta:hover { background: #1ebd59; }
    .restart-btn {
      margin-top: 16px;
      background: transparent; border: none;
      color: var(--steel);
      font-family: 'Barlow', sans-serif;
      font-size: 0.82rem;
      cursor: pointer; text-decoration: underline;
      padding: 0; display: block;
      margin-left: auto; margin-right: auto;
    }

    /* ── CEP BLOCK ── */
    .cep-block {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      margin-top: 32px;
      text-align: left;
    }
    .cep-block h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: var(--green-lt);
      margin-bottom: 4px;
    }
    .cep-block p { font-size: 0.82rem; color: var(--steel); margin-bottom: 18px; }
    .cep-input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .cep-input {
      flex: 1; min-width: 160px; padding: 11px 14px;
      background: #030705; border: 2px solid var(--border);
      border-radius: 8px; color: var(--offwhite);
      font-family: 'Barlow', sans-serif; font-size: 1rem;
      font-weight: 600; letter-spacing: 1px; outline: none;
      transition: border-color .2s;
    }
    .cep-input:focus { border-color: var(--green); }
    .cep-feedback { margin-top: 12px; font-size: 0.85rem; font-weight: 600; display: none; }
    .cep-feedback.ok  { color: var(--green-lt); display: block; }
    .cep-feedback.err { color: #ef9a9a; display: block; }
    .btn-cep {
      padding: 11px 22px; border: none; border-radius: 8px;
      background: var(--green-dk); color: #fff;
      font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 0.88rem;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
      transition: background .2s; white-space: nowrap;
    }
    .btn-cep:hover { background: var(--green); }

    /* ── QUANTIDADE ── */
    .qty-block {
      display: flex; align-items: center; gap: 12px; margin-top: 16px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px; max-width: 860px; margin-left: auto; margin-right: auto;
    }
    .qty-label {
      font-size: 0.85rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: #ccd8cc; flex: 1; text-align: left;
    }
    .qty-controls { display: flex; align-items: center; border: 2px solid var(--green-dk); border-radius: 8px; overflow: hidden; }
    .qty-btn {
      background: var(--green-dk); border: none; color: #fff; width: 34px; height: 34px;
      font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0;
    }
    .qty-btn:hover { background: var(--green); color: #000; }
    .qty-input {
      width: 54px; height: 34px; background: #030705; border: none;
      color: var(--offwhite); font-family: 'Barlow', sans-serif; font-size:
